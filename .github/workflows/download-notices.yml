name: Download interest-rate notices

# Keeps the latest interest-rate notice of every bank in the `notices/` folder on `main`.
# When a bank publishes a new notice, its older file is replaced (git history keeps the old ones).
# Runs every day and can also be started by hand from the Actions tab.

on:
  schedule:
    - cron: "15 3 * * *" # 03:15 UTC = 09:00 Nepal time
  workflow_dispatch:
    inputs:
      sectors:
        description: "Sectors to process"
        type: choice
        options: ["development commercial", "development", "commercial"]
        default: "development commercial"
      fiscal_year:
        description: "Nepali fiscal year, e.g. 083-084 (blank = latest on the site)"
        type: string
        default: ""
      all_notices:
        description: "Keep every notice (default: only the latest notice of each bank)"
        type: boolean
        default: false
      png:
        description: "Also save PNG copies"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: download-notices
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build options
        id: opts
        env:
          SECTORS: ${{ inputs.sectors || 'development commercial' }}
          FISCAL_YEAR: ${{ inputs.fiscal_year }}
          ALL_NOTICES: ${{ inputs.all_notices }}
          PNG: ${{ inputs.png }}
        run: |
          args="--sectors $SECTORS"
          [ -n "$FISCAL_YEAR" ] && args="$args --fiscal-year $FISCAL_YEAR"
          [ "$ALL_NOTICES" = "true" ] && args="$args --all"
          [ "$PNG" = "true" ] && args="$args --png"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Download notices
        shell: bash # enables pipefail, so a scraper error fails the step despite `tee`
        run: |
          python -m merolagani_notices ${{ steps.opts.outputs.args }} --output notices 2>&1 | tee run.log

      - name: Commit changes to notices/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A notices
          if git diff --cached --quiet; then
            echo "No new notices."
            echo "### No new interest-rate notices" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          added=$(git diff --cached --name-only --diff-filter=A -- notices ':!notices/manifest.csv' | wc -l)
          removed=$(git diff --cached --name-only --diff-filter=D -- notices ':!notices/manifest.csv' | wc -l)
          git commit -m "Latest notices: $added added, $removed replaced - $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          {
            echo "### $added new notice file(s), $removed older file(s) replaced"
            echo '```'
            grep -E '^(===|---|  \+)' run.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: run-log
          path: run.log
          if-no-files-found: ignore
